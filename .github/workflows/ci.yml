name: CI

on:
  push:
    # main/beta = post-merge run. renovate/** lets Renovate's branch-automerge
    # updates (which never open a PR) run CI on the branch so the default-branch
    # ruleset can fast-forward the target branch once the branch is green.
    branches: [main, beta, 'renovate/**']
  # Stacked PRs need the same required checks before their base reaches main.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: "postgres:18@sha256:\
          e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42"
        env:
          POSTGRES_DB: aura
          POSTGRES_PASSWORD: aura-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aura"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      # mattn/go-sqlite3 is a cgo package; the backend does not build without it.
      CGO_ENABLED: '1'
      AURA_TEST_POSTGRES_DSN: >-
        postgres://postgres:aura-ci-only@127.0.0.1:5432/aura?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Check storage compatibility review
        run: |
          ../scripts/test-postgres-compat.sh
          ../scripts/check-postgres-compat.sh

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "${unformatted}"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        env:
          # config.init() creates CONFIG_PATH (default /config, not writable in
          # CI) at package init, so any test that transitively imports config
          # panics. Point it at a writable dir, as documented for local/test runs.
          CONFIG_PATH: ${{ runner.temp }}/aura-config
        run: go test ./...

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
