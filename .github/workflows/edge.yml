name: Edge image

# Publishes the rolling :edge channel — the current tip of main, built on every push,
# independent of releases. Tagged commits are built by release.yml instead.
#
#   push to main -> ghcr.io/<owner>/aura:edge + :edge-<sha>
#
# semantic-release's own version-bump commit carries [skip ci], which GitHub honours
# natively, so a release does not produce an :edge build. :edge therefore trails
# :latest by exactly that bump commit (VERSION.txt / version.json / CHANGELOG.md only)
# until the next real push to main.

on:
  push:
    branches: [main]

permissions:
  contents: read

# Serialize :edge builds so a slower older build can't finish last and win the
# floating tag. GitHub also cancels superseded *pending* runs in the group, so a burst
# of pushes collapses to the newest — which is the right semantic for a rolling tag.
concurrency:
  group: edge-image
  cancel-in-progress: false

jobs:
  edge-image:
    name: Build & push :edge
    runs-on: ubuntu-latest
    # Belt-and-braces alongside GitHub's native [skip ci] handling for the release
    # commit; see the header note on why :edge skips it.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/aura
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute image tags and APP_VERSION
        id: meta
        run: |
          # Base the edge version on the last released version with an -edge.<sha>
          # suffix, so the app reports something SemVer-ordered that sorts below the
          # next release but identifies the exact commit baked in.
          head_sha="$(git rev-parse --short=7 HEAD)"
          base="$(cat VERSION.txt 2>/dev/null || echo v0.0.0)"
          echo "tags=${IMAGE}:edge,${IMAGE}:edge-${head_sha}" >> "$GITHUB_OUTPUT"
          echo "app_version=${base}-edge.${head_sha}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.app_version }}
          tags: ${{ steps.meta.outputs.tags }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.3"

      - name: Sign image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [ -z "${DIGEST}" ]; then
            echo "::error::build-push-action produced no digest; cannot sign image" >&2
            exit 1
          fi
          cosign sign --yes "${IMAGE}@${DIGEST}"

      # buildx `sbom: true` attaches SPDX only -- BuildKit cannot emit CycloneDX.
      # Same two-format treatment as release.yml, so :edge is inspectable the same
      # way a released tag is. syft resolves the multi-arch index to one manifest.
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        env:
          # Default `owned-by-package` emits a purl-less, license-less `type: file`
          # component per package-owned file -- pure ballast.
          SYFT_FILE_METADATA_SELECTION: none
          # Resolve licenses upstream for ecosystems that ship none in-image.
          # Best-effort: an unreachable registry degrades coverage, never fails build.
          SYFT_ENRICH: golang,javascript,python
          # `enrich: python` also drives guess-unpinned-requirements, which invents
          # versions for unpinned entries; keep it explicitly off.
          SYFT_PYTHON_GUESS_UNPINNED_REQUIREMENTS: 'false'
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false

      - name: Attach CycloneDX SBOM attestation (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "${IMAGE}@${DIGEST}"
