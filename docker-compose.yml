services:
    aura:
        image: ghcr.io/jabrown93/aura:latest@sha256:539deed9497cc4d5f60a5e5e642601cc47862ebfe7833169876af9678b024a60 # Use the latest image from GitHub Container Registry
        container_name: aura # Name of the container

        # Automatically restart the container if it crashes or the server reboots
        restart: unless-stopped

        ## Synology Users: 1026:100 to use your default user (the main DSM account)
        ## Unraid Users: 99:100 to use the default Unraid user (nobody)
        ## Linux Users: You can find your PUID and PGID by running the `id username` command
        user: "${PUID}:${PGID}" # Optional to run as non-root user

        ports:
            - "3000:3000" # Web UI PORT
            - "8888:8888" # API PORT
            ## HTTPS ports — uncomment when TLS_CERT_FILE/TLS_KEY_FILE are set below
            # - "3443:3443" # Web UI HTTPS PORT
            # - "8443:8443" # API HTTPS PORT

        # Make sure to change these paths to match your host system
        volumes:
            - /mnt/user/appdata/aura:/config # Config directory
            - /mnt/user/data/media/:/data/media # This should be the same as your Media Server Docker container. Both the host and container paths must match exactly.

        # Add environment variables for PUID, PGID, and UMASK
        environment:
            - PUID=99
            - PGID=100
            - UMASK=022
            - TZ=America/New_York # Set your timezone, e.g., America/New_York
            ## HTTPS: mount your certificate and key (e.g. under /config) and point
            ## these at them. Both must be set; restart the container after rotating.
            # - TLS_CERT_FILE=/config/certs/tls.crt
            # - TLS_KEY_FILE=/config/certs/tls.key
